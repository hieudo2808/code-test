version: "3.8"

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  server:
    build: .
    image: judge0-custom
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "2358:2358"
    privileged: true
    <<: *default-logging
    restart: always

  worker:
    build: .
    image: judge0-custom
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    privileged: true
    <<: *default-logging
    restart: always
