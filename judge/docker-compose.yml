version: "3.8"

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  server:
    image: hieudo2808/judge0-custom:latest
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "2358:2358"
    privileged: true
    restart: always
    <<: *default-logging

  worker:
    image: hieudo2808/judge0-custom:latest
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    privileged: true
    restart: always
    <<: *default-logging