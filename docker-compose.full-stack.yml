version: '3.8'

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  # ================= JUDGE0 =================
  judge0-server:
    image: hieudo2808/judge0-custom:latest
    container_name: judge0-server
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "127.0.0.1:2358:2358"
    privileged: true
    restart: always
    <<: *default-logging
    networks:
      - codetrials-network

  judge0-worker:
    image: hieudo2808/judge0-custom:latest
    container_name: judge0-worker
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    restart: always
    <<: *default-logging
    networks:
      - codetrials-network
    depends_on:
      - judge0-server

  # ================= BACKEND =================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codetrials-backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod 
      
      # Database (Supabase/Neon)
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      
      # Redis (Upstash)
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SSL_ENABLED=true
      
      # Security & Cloud
      - JWT_SECRET=${JWT_SECRET}
      - SECURITY_PEPPER=${SECURITY_PEPPER}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      
      # Judge0 Internal
      - JUDGE0_BASE_URL=http://judge0-server:2358
      - JUDGE0_CALLBACK_URL=http://backend:8080/api/internal/judge/callback
    depends_on:
      judge0-server:
        condition: service_started
    networks:
      - codetrials-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  codetrials-network:
    driver: bridge